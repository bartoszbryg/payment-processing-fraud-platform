spring:
  application:
    name: payment-fraud-detection

  profiles:
    active: dev

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# Queue and Worker config
queue:
  capacity: 10000

worker:
  pool:
    size: 4

# Fraud detection thresholds
fraud:
  block:
    score-threshold: 70.0
    # Set to 86 to skip graph/ML when CRITICAL is already confirmed (RiskLevel.CRITICAL starts at 86)
    # Set to 70 to skip when the block decision is certain regardless of risk label
    # Set to 100 to only skip when the score is already maxed out
    short-circuit-score: 86.0

  review:
    score-threshold: 40.0

  rules:
    high-amount:
      threshold: 10000
      critical-threshold: 50000

    rapid-transaction:
      window-minutes: 5
      max-count: 3
      critical-count: 10

    velocity:
      daily-limit: 20000
      hourly-limit: 5000

    location:
      # Configurable without code changes; override at runtime via env var:
      # FRAUD_RULES_LOCATION_HIGH_RISK_COUNTRIES=KP,IR,SY
      high-risk-countries: KP,IR,SY,CU,SD,MM,BY,RU

  graph:
    rebuild-interval-ms: 300000

# ML Fraud Scoring Microservice
ml:
  service:
    enabled: false
    # Post-approval enrichment (MlFraudEnrichmentService) creates a FraudAlert when the
    # ML fraud probability is at or above this. Matches the README's documented
    # "MlFraudRule Python model probability >= 0.4" threshold.
    suspicion-threshold: 0.4

# App metadata
info:
  app:
    name: Payment Fraud Detection System
    version: 1.0.0
    description: Real-time fraud detection with rule-based and graph-based analysis